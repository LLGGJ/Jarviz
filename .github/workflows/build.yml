name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - name: Publicar o APK direto (Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "Jarvis-${{ github.run_number }}.apk"
          gh release create "build-${{ github.run_number }}" "Jarvis-${{ github.run_number }}.apk" \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Jarvis build ${{ github.run_number }}" \
            --notes "APK direto. Build ${{ github.run_number }} (${{ github.ref_name }})" --prerelease
